<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070A; --s1:#0C0E13; --s2:#13161D; --s3:#1B1F29;
  --hair:#161921; --line:#272C38;
  --txt:#ECE9E1; --mid:#ABA9A2; --dim:#767A87; --eq:#4B5060;
  --acc:#E8DDBF; --acc2:#CFC3A0; --glow:rgba(232,221,191,.28);
  --nav:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--txt);font-family:Geist,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-feature-settings:"ss01";
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px);
}
body.resting{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 82px)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;font-size:16px;color:var(--txt);background:var(--s2);border:0;border-radius:10px;padding:11px 12px;width:100%;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input::placeholder{color:#4F5462}
input:focus,select:focus{outline:1.5px solid var(--acc);outline-offset:0}
button:focus-visible{outline:1.5px solid var(--acc);outline-offset:2px;border-radius:8px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 28px;position:relative;z-index:1}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.moon{position:absolute;top:calc(env(safe-area-inset-top,0px) - 96px);right:-84px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 36% 36%,rgba(236,230,210,.17),rgba(236,230,210,.08) 58%,rgba(236,230,210,0) 70.5%),
             radial-gradient(circle at 62% 58%,rgba(6,7,10,.35) 0 7%,transparent 7.5%),
             radial-gradient(circle at 44% 66%,rgba(6,7,10,.28) 0 4%,transparent 4.5%),
             radial-gradient(circle at 58% 30%,rgba(6,7,10,.22) 0 3%,transparent 3.5%);
  box-shadow:0 0 140px 40px rgba(232,221,191,.045)}
.fly{position:absolute;left:0;top:0;opacity:.55;will-change:transform}
.fly svg{display:block;width:100%;height:auto}
.fly path{fill:var(--acc)}
.fly .wd{opacity:0}
.fly .wu{animation:flA var(--flap,.32s) steps(1,end) infinite}
.fly .wd{animation:flB var(--flap,.32s) steps(1,end) infinite}
@keyframes flA{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes flB{0%,49.9%{opacity:0}50%,100%{opacity:1}}
.f1{width:30px;animation:path1 34s linear infinite}
.f2{width:20px;opacity:.38;animation:path2 47s linear infinite 9s;--flap:.26s}
.f3{width:24px;opacity:.45;animation:path3 41s linear infinite 21s;--flap:.3s}
@keyframes path1{0%{transform:translate(110vw,120px)}25%{transform:translate(70vw,60px)}50%{transform:translate(42vw,140px)}75%{transform:translate(14vw,70px)}100%{transform:translate(-60px,110px)}}
@keyframes path2{0%{transform:translate(-40px,40px)}30%{transform:translate(30vw,90px)}60%{transform:translate(64vw,30px)}100%{transform:translate(110vw,80px)}}
@keyframes path3{0%{transform:translate(110vw,200px)}35%{transform:translate(60vw,170px)}70%{transform:translate(25vw,230px)}100%{transform:translate(-50px,180px)}}
@media (prefers-reduced-motion:reduce){.fly{display:none}}
#restBat{position:absolute;top:-8px;width:22px;margin-left:-11px;transition:left .25s linear;pointer-events:none}
#restBat path{fill:var(--acc)}
#restBat .wd{opacity:0}
#restBat .wu{animation:flA .28s steps(1,end) infinite}
#restBat .wd{animation:flB .28s steps(1,end) infinite}
.rest-in{overflow:visible!important}

/* header */
.top{max-width:540px;margin:0 auto;padding:22px 16px 16px;display:flex;align-items:flex-end;gap:12px;position:relative;z-index:1}
.top h1{font-family:'Big Shoulders Display',Geist,sans-serif;font-weight:800;font-size:38px;letter-spacing:.005em;line-height:.95}
.top .sub{font-size:12px;color:var(--dim);margin-top:5px}
.iconbtn{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--s1);display:flex;align-items:center;justify-content:center;color:var(--mid)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,8,10,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nav-in button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--dim)}
.nav-in button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-in button.on{color:var(--txt)}
.nav-in button.on::before{content:"";position:absolute;top:4px;left:50%;width:22px;height:7px;margin-left:-11px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%2014%2064%2019%22%3E%3Cpath%20fill%3D%22%23E8DDBF%22%20fill-opacity%3D%221%22%20d%3D%22M32%2018.5%20L30.8%2015.8%20L30%2019.6%20C29%2020.2%2028.4%2021%2028.2%2022%20C22%2020%2013%2021%203%2026%20C7%2026.5%209%2028%2010%2030%20C12.5%2028.8%2015%2029%2017%2030.5%20C18.5%2028.8%2021%2028.4%2023%2029.2%20C25%2028.4%2027%2027.6%2028.6%2028%20C29.6%2030%2030.8%2031.2%2032%2031.2%20C33.2%2031.2%2034.4%2030%2035.4%2028%20C37%2027.6%2039%2028.4%2041%2029.2%20C43%2028.4%2045.5%2028.8%2047%2030.5%20C49%2029%2051.5%2028.8%2054%2030%20C55%2028%2057%2026.5%2061%2026%20C51%2021%2042%2020%2035.8%2022%20C35.6%2021%2035%2020.2%2034%2019.6%20L33.2%2015.8%20Z%22/%3E%3C/svg%3E") no-repeat center/contain}

/* surfaces */
.plate{background:var(--s1);border-radius:16px;overflow:hidden;margin-bottom:10px}
.pad{padding:16px}
.ri{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.plate>.ri+.ri,.plate>.ri+.set,.hairtop{border-top:1px solid var(--hair)}
.lbl{font-size:12px;color:var(--dim);margin:24px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.tiny{font-size:12px} .dim{color:var(--dim)} .mid{color:var(--mid)}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px}

.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:13px;font-weight:600;font-size:15px;background:var(--acc);color:#0B0B0C}
.btn:active{background:var(--acc2)}
.btn.sec{background:var(--s2);color:var(--txt);font-weight:500}
.btn.ter{background:none;color:var(--dim);font-weight:500;padding:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--s2);font-size:13px;color:var(--mid);white-space:nowrap}
.chip.on{background:var(--txt);color:#0B0B0C}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.link{color:var(--acc);font-size:13px;font-weight:500}
.empty{padding:28px 18px;text-align:center;color:var(--dim);font-size:14px}
.empty::before{content:"";display:block;width:40px;height:12px;margin:0 auto 12px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%2014%2064%2019%22%3E%3Cpath%20fill%3D%22%23767A87%22%20fill-opacity%3D%221%22%20d%3D%22M32%2018.5%20L30.8%2015.8%20L30%2019.6%20C29%2020.2%2028.4%2021%2028.2%2022%20C22%2020%2013%2021%203%2026%20C7%2026.5%209%2028%2010%2030%20C12.5%2028.8%2015%2029%2017%2030.5%20C18.5%2028.8%2021%2028.4%2023%2029.2%20C25%2028.4%2027%2027.6%2028.6%2028%20C29.6%2030%2030.8%2031.2%2032%2031.2%20C33.2%2031.2%2034.4%2030%2035.4%2028%20C37%2027.6%2039%2028.4%2041%2029.2%20C43%2028.4%2045.5%2028.8%2047%2030.5%20C49%2029%2051.5%2028.8%2054%2030%20C55%2028%2057%2026.5%2061%2026%20C51%2021%2042%2020%2035.8%2022%20C35.6%2021%2035%2020.2%2034%2019.6%20L33.2%2015.8%20Z%22/%3E%3C/svg%3E") no-repeat center/contain}

/* figures */
.fig{width:100%;height:100%;display:block}
.fig line,.fig circle{stroke:#878B98;stroke-width:3.2;stroke-linecap:round;fill:none}
.fig .mv{stroke:var(--acc);filter:drop-shadow(0 0 2.5px rgba(232,221,191,.55))}
.fig .eq{stroke:var(--eq)}
.fig .gr{stroke:var(--line);stroke-width:1}
.fig .pB{opacity:.16}
.fig.anim .pA{animation:oa 1.7s ease-in-out infinite alternate}
.fig.anim .pB{animation:ob 1.7s ease-in-out infinite alternate}
@keyframes oa{0%,16%{opacity:1}84%,100%{opacity:.1}}
@keyframes ob{0%,16%{opacity:.1}84%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.fig.anim .pA{animation:none;opacity:1}.fig.anim .pB{animation:none;opacity:.24}}
.thumb{width:44px;height:52px;flex:0 0 44px;border-radius:10px;background:var(--s2);overflow:hidden}
.stage{height:260px;border-radius:16px;margin-bottom:14px;background-color:var(--s1);background-image:radial-gradient(var(--s3) 1px,transparent 1.2px);background-size:12px 12px;display:flex;justify-content:center;padding:14px 0}
.stage .fig{width:210px}
.photo{position:relative;aspect-ratio:850/567;border-radius:16px;overflow:hidden;background:#f4f4f2;margin-bottom:8px;cursor:pointer}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06)}
.photo .p1{animation:ob 2.6s ease-in-out infinite alternate}
.phl{position:absolute;left:10px;bottom:10px;height:26px;width:84px}
.phl span{position:absolute;left:0;top:0;padding:5px 10px;border-radius:999px;background:rgba(8,8,10,.86);color:var(--txt);font-size:12px}
.phl .l0{animation:la 2.6s ease-in-out infinite alternate}
.phl .l1{animation:lb 2.6s ease-in-out infinite alternate}
@keyframes la{0%,48%{opacity:1}52%,100%{opacity:0}}
@keyframes lb{0%,48%{opacity:0}52%,100%{opacity:1}}
.phfig{position:absolute;right:8px;bottom:8px;width:52px;height:62px;border-radius:10px;background:rgba(8,8,10,.86)}
.photo.paused img,.photo.paused span{animation-play-state:paused}
.phhint{margin:0 2px 14px}
@media (prefers-reduced-motion:reduce){.photo .p1{animation:none;opacity:.5}.phl .l0,.phl .l1{animation:none}.phl .l1{opacity:0}}

/* session */
.exhead{display:flex;align-items:center;gap:12px;padding:12px 14px 10px}
.exhead b{font-weight:500;font-size:15px}
.cols,.set{display:grid;grid-template-columns:34px 1fr 66px 56px 42px;gap:6px;align-items:center;padding:0 12px}
.cols{font-size:11px;color:var(--dim);padding-bottom:4px}
.cols span{text-align:center}
.cols span:nth-child(2){text-align:left;padding-left:4px}
.set{padding-top:5px;padding-bottom:5px}
.set.done{background:rgba(237,237,234,.035)}
.sidx{height:36px;border-radius:9px;font-size:13px;color:var(--mid)}
.set.k-w .sidx{color:var(--dim);font-style:italic}
.set.k-f .sidx{color:var(--txt);text-decoration:underline;text-underline-offset:3px}
.prev{height:36px;text-align:left;padding-left:4px;font-size:13px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.num{padding:8px 4px;text-align:center;font-family:'Geist Mono',monospace;font-size:17px;border-radius:9px;background:var(--s2)}
.set.done .num{background:transparent;color:var(--mid)}
.chk{height:36px;width:36px;justify-self:center;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.chk svg{width:16px;height:16px;stroke:#0B0B0C;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set.done .chk{background:var(--txt);border-color:var(--txt)}
.set.pr .chk{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--acc)}
.exfoot{display:flex;gap:16px;padding:10px 16px 12px}
.exfoot button{font-size:13px;color:var(--mid)}
.sug{display:flex;gap:10px;padding:11px 16px 13px;font-size:13px;color:var(--mid);border-top:1px solid var(--hair)}
.sug i{font-style:normal;color:var(--acc)}
.sess{display:flex;gap:22px;padding:14px 16px}
.sess .v{font-size:20px;font-weight:400;letter-spacing:-.02em}
.sess .k{font-size:11px;color:var(--dim)}

/* rest */
#rest{position:fixed;left:0;right:0;z-index:39;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));display:none;padding:0 10px 8px}
#rest.on{display:block}
.rest-in{max-width:520px;margin:0 auto;background:var(--s2);border-radius:16px;position:relative}
.rest-bar{border-radius:16px 16px 0 0}
.rest-bar{position:absolute;left:0;right:0;top:0;height:2px;background:var(--acc);transform-origin:left;transition:transform .25s linear}
.rest-row{display:flex;align-items:center;gap:10px;padding:12px 14px}
#restT{font-size:28px;font-weight:300;letter-spacing:-.03em;color:var(--acc);text-shadow:0 0 18px var(--glow)}
.rest-row button{padding:9px 12px;border-radius:10px;background:var(--s3);font-size:13px;color:var(--mid)}

/* food */
.kc{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.kc-big{font-size:56px;font-weight:300;letter-spacing:-.05em;line-height:.95;color:var(--acc);text-shadow:0 0 28px var(--glow)}
.kc-big.over{color:var(--txt)}
.kc-side{text-align:right;font-size:13px;line-height:1.7}
.track{height:3px;background:var(--s3);border-radius:3px;margin:18px 0 6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:3px}
.track i.over{background:var(--txt)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.mac .k{font-size:11px;color:var(--dim)}
.mac .v{font-size:15px;margin:2px 0 6px}
.mac .t{height:2px;background:var(--s3);border-radius:2px;overflow:hidden}
.mac .t i{display:block;height:100%;background:var(--mid)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.daynav button{width:38px;height:38px;border-radius:12px;background:var(--s1);color:var(--mid);font-size:18px}
.daynav button:disabled{opacity:.3}
.daynav .d{font-size:14px;font-weight:500}
.mealh{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 8px}
.mealh b{font-weight:500}
.fi{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--hair)}
.fi .n{font-size:14px}
.fi .m{font-size:12px;color:var(--dim);margin-top:1px}
.x{color:var(--dim);width:30px;height:30px;font-size:15px;border-radius:8px}
.x:disabled,.prev:disabled{opacity:.25;cursor:default}

/* progress */
.bars{display:flex;align-items:flex-end;gap:7px;height:110px;margin:16px 0 8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bars i{display:block;width:100%;background:var(--s3);border-radius:4px;min-height:2px}
.bars i.now{background:var(--acc);box-shadow:0 0 14px var(--glow)}
.bars span{font-size:10px;color:var(--dim)}
.big{font-size:40px;font-weight:300;letter-spacing:-.045em;line-height:1}
.wchart{width:100%;height:120px;display:block;margin-top:14px}

/* sheet */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:none}
.modal.on{display:block}
.modal.small .sheet{top:auto;max-height:85vh}
.modal.small .sheet-b{flex:none}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 40px);background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;max-width:540px;width:100%;margin:0 auto}
.sheet-h h2{font-family:'Big Shoulders Display',Geist,sans-serif;font-weight:800;font-size:28px;letter-spacing:.005em;flex:1;line-height:1}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-b .inner{max-width:540px;margin:0 auto}
.cues{margin:0;padding:0;list-style:none}
.cues li{padding:11px 16px;border-top:1px solid var(--hair);font-size:14px;color:var(--mid);display:flex;gap:12px}
.cues li:first-child{border-top:0}
.cues li span{color:var(--dim);font-family:'Geist Mono',monospace;font-size:12px;padding-top:2px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--dim);margin:0 2px 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai{margin-top:12px;font-size:14px;color:var(--mid);white-space:pre-wrap;border-left:2px solid var(--acc);padding:2px 0 2px 12px}
.spin{display:inline-block;width:12px;height:12px;border:1.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,8px);background:var(--txt);color:#0B0B0C;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:80;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.resting .toast{bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 92px)}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"><div class="moon"></div></div>
<div class="top">
  <div class="grow">
    <h1 id="pageTitle">Séance</h1>
    <div class="sub mono" id="pageSub">—</div>
  </div>
  <button class="iconbtn" data-act="profile" aria-label="Profil et réglages">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.4-3.6 4.1-5.2 7.5-5.2s6.1 1.6 7.5 5.2"/></svg>
  </button>
</div>

<main class="wrap" id="view"></main>

<div id="rest" aria-live="polite">
  <div class="rest-in">
    <div class="rest-bar" id="restBar"></div><span id="restBat" aria-hidden="true"></span>
    <div class="rest-row">
      <div class="grow"><div class="tiny dim">Repos</div><div id="restT" class="mono">2:00</div></div>
      <button data-act="restAdj" data-v="-15">−15</button>
      <button data-act="restAdj" data-v="15">+15</button>
      <button data-act="restSkip">Passer</button>
    </div>
  </div>
</div>

const SEG=[['neck','hip'],['hip','knee'],['knee','ankle'],['shoulder','elbow'],['elbow','hand']];
const moved=(p,q,j)=>Math.abs(p[j][0]-q[j][0])+Math.abs(p[j][1]-q[j][1])>1.5;
function drawPose(p,q,o,cls){
  const ln=(x1,y1,x2,y2,c)=>`<line${c?` class="${c}"`:''} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const m=x=>100-x, f=o.footDir===-1?-9:9;
  let s=`<g class="${cls}">`;
  if(o.bench) s+=ln(14,o.bench,76,o.bench,'eq');
  if(o.bar==='fixed') s+=ln(16,10,84,10,'eq');
  s+=`<circle cx="${p.head[0]}" cy="${p.head[1]}" r="6.5"/>`;
  SEG.forEach(([a,b])=>{
    const c=(moved(p,q,a)||moved(p,q,b))?'mv':'';
    s+=ln(p[a][0],p[a][1],p[b][0],p[b][1],c);
    if(o.mirror && a!=='neck') s+=ln(m(p[a][0]),p[a][1],m(p[b][0]),p[b][1],c);
  });
  const fc=moved(p,q,'ankle')?'mv':'';
  s+=ln(p.ankle[0],p.ankle[1],p.ankle[0]+f,p.ankle[1],fc);
  if(o.mirror) s+=ln(m(p.ankle[0]),p.ankle[1],m(p.ankle[0])-f,p.ankle[1],fc);
  if(o.bar==='hand') s+=ln(p.hand[0]-15,p.hand[1],p.hand[0]+15,p.hand[1],'eq');
  if(o.bar==='shoulder') s+=ln(p.shoulder[0]-16,p.shoulder[1]-3,p.shoulder[0]+16,p.shoulder[1]-3,'eq');
  if(o.bar==='dumb'){
    s+=ln(p.hand[0]-6,p.hand[1],p.hand[0]+6,p.hand[1],'eq');
    if(o.mirror) s+=ln(m(p.hand[0])-6,p.hand[1],m(p.hand[0])+6,p.hand[1],'eq');
  }
  return s+'</g>';
}

const DEF={sexe:'h',age:35,taille:175,poids:78,act:1.55,obj:'maintien',tdeeAdapt:null};

function computeTargets(pr){
  const base=10*pr.poids+6.25*pr.taille-5*pr.age+(pr.sexe==='h'?5:-161);
  const tdee=pr.tdeeAdapt||base*pr.act;
  const mult=pr.obj==='perte'?0.85:pr.obj==='prise'?1.10:1;
  const kcal=Math.max(Math.round(tdee*mult/10)*10,Math.round(base/10)*10); // plancher : métabolisme de base
  const prot=Math.round(pr.poids*1.8), lip=Math.round(pr.poids*0.8);
  return {kcal,prot,lip,gluc:Math.max(0,Math.round((kcal-prot*4-lip*9)/4)),tdee:Math.round(tdee),base:Math.round(base),adapt:!!pr.tdeeAdapt};
}

/* ═════════ 6. PROGRESSION — verdicts en JS, jamais dans le modèle ═════════ */
const isWork=s=>s.k!=='w';
const est1RM=(w,r)=>w*(1+r/30);
function lastEntry(exId){
  for(const w of S.get('workouts',[])){
    const e=(w.ex||[]).find(x=>x.exId===exId);
    if(e && e.sets.some(s=>s.done)) return {date:w.date,sets:e.sets.filter(s=>s.done)};
  }
  return null;
}
function suggest(exId,repOv){
  const ex=exById(exId), le=lastEntry(exId); if(!ex) return null;
  const hi=(repOv||ex.rep)[1];
  const work=le?le.sets.filter(isWork).filter(s=>s.w!==''&&s.r!==''):[];
  if(!work.length) return {txt:`Première fois. Choisis une charge où ${hi} répétitions restent propres.`,w:null};
  const top=Math.max(...work.map(s=>+s.w)), reps=work.map(s=>+s.r), step=ex.t==='lourd'?2.5:1.25;
  if(reps.every(r=>r>=hi)) return {txt:`${work.length}×${reps.join('/')} à ${top} kg la dernière fois, toutes au plafond. Passe à ${top+step} kg.`,w:top+step,up:true};
  return {txt:`${work.length}×${reps.join('/')} à ${top} kg la dernière fois. Reste à ${top} kg, vise ${hi} répétitions partout.`,w:top};
}
function best1RM(exId){
  let b=0;
  S.get('workouts',[]).forEach(w=>(w.ex||[]).forEach(e=>{ if(e.exId!==exId) return;
    e.sets.forEach(s=>{ if(s.done&&isWork(s)&&s.w&&s.r) b=Math.max(b,est1RM(+s.w,+s.r)); }); }));
  return b;
}
const volumeOf=w=>(w.ex||[]).reduce((t,e)=>t+e.sets.reduce((a,s)=>a+(s.done&&isWork(s)?(+s.w||0)*(+s.r||0):0),0),0);

function genProgram(g){
  const avail=EQUIP[g.eq], R=GOALREPS[g.obj];
  return SPLITS[g.days].map(dk=>{
    const [name,slots]=DAYS[dk], used=new Set(), ex=[];
    for(const raw of slots){
      if(g.lvl==='deb' && ex.length>=5) break;
      const v=raw.endsWith('*')?1:0, key=raw.replace('*',''), sl=SLOTS[key];
      let ids=sl.ids.filter(id=>EQ[id].some(e=>avail.includes(e)) && !used.has(id));
      if(key==='pullV' && g.lvl==='conf') ids=ids.slice().reverse();
      if(!ids.length) continue;
      const id=ids[Math.min(v,ids.length-1)]; used.add(id);
      ex.push({exId:id, n:sl.c?(g.lvl==='deb'?3:4):3, rep:(sl.c?R[0]:R[1]).slice()});
    }
    return {name,ex};
  }).filter(d=>d.ex.length);
}

/* ═════════ 12. POIDS & DÉPENSE ADAPTATIVE (calcul en JS) ═════════ */
function weightSeries(){
  const W=S.get('weights',{}), ds=Object.keys(W).sort(); if(!ds.length) return [];
  const out=[]; let t=null;
  for(let d=ds[0]; d<=today(); d=addDays(d,1)){
    const raw=W[d]??null;
    if(raw!==null) t = t===null ? raw : t+0.1*(raw-t); // moyenne mobile exponentielle
    out.push({d,raw,t});
  }
  return out;
}
function adaptive(){
  const ser=weightSeries(), end=today(), start=addDays(end,-20);
  const win=ser.filter(x=>x.d>=start), wi=win.filter(x=>x.raw!==null);
  const logged=[]; for(let d=start; d<end; d=addDays(d,1)){ /* aujourd'hui exclu : journée incomplète */ const k=totals(dayLog(d)).kcal; if(k>0) logged.push(k); }
  const span=wi.length>1?daysBetween(wi[0].d,wi[wi.length-1].d):0;
  const st={pesees:wi.length,jours:logged.length,span};
  if(wi.length<4||span<13||logged.length<10) return {ok:false,...st};
  const avg=logged.reduce((a,b)=>a+b,0)/logged.length;
  const dT=wi[wi.length-1].t-wi[0].t;
  const tdee=Math.round((avg-dT*7700/span)/10)*10;
  const base=computeTargets(Object.assign(getProfile(),{tdeeAdapt:null})).base;
  if(tdee<base||tdee>5500) return {ok:false,incoherent:true,...st};
  return {ok:true,tdee,avg:Math.round(avg),dT,...st};
}

function weekKey(d){ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return iso(x); }
function weightChart(ser){
  const pts=ser.slice(-35); if(pts.length<2) return '';
  const vals=pts.flatMap(p=>[p.raw,p.t]).filter(v=>v!==null);
  let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<1){lo-=.5;hi+=.5}
  const W=320,H=120,X=i=>6+i*(W-12)/(pts.length-1),Y=v=>8+(hi-v)*(H-16)/(hi-lo);
  let s=`<svg class="wchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  pts.forEach((p,i)=>{ if(p.raw!==null) s+=`<circle cx="${X(i)}" cy="${Y(p.raw)}" r="2.2" fill="none" stroke="#4B5060" stroke-width="1.2"/>`; });
  s+=`<polyline fill="none" stroke="#ECE9E1" stroke-width="1.6" stroke-linejoin="round" points="${pts.map((p,i)=>p.t!==null?`${X(i)},${Y(p.t)}`:'').filter(Boolean).join(' ')}"/>`;
  const L=pts[pts.length-1]; if(L.t!==null) s+=`<circle cx="${X(pts.length-1)}" cy="${Y(L.t)}" r="3.5" fill="#E8DDBF"/>`;
  return s+`</svg>`;
}

    h+=`<div class="mid">Calcul disponible après deux semaines de données.</div>
      <div class="tiny dim" style="margin-top:6px">L'application compare ce que tu manges à l'évolution de ta tendance de poids pour mesurer ta vraie dépense, au lieu de l'estimer par formule.</div>
      <div class="mono tiny mid" style="margin-top:12px;line-height:1.9">${ad.pesees}/4 pesées · ${ad.jours}/10 jours de repas renseignés · ${ad.span}/14 jours d'écart</div>`;
  }
  h+=`</div>`;
  if(hist.length){
    const byW={}; hist.forEach(w=>{const k=weekKey(w.date);byW[k]=(byW[k]||0)+volumeOf(w)});
    const cur=weekKey(today()), weeks=[];
    for(let i=7;i>=0;i--){ const k=addDays(cur,-7*i); weeks.push({v:byW[k]||0,l:new Date(k+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'})}); }
    const mx=Math.max(1,...weeks.map(w=>w.v));
    h+=`<div class="lbl"><span>Volume par semaine</span><span class="mono">${nf(weeks[7].v)} kg</span></div><div class="plate pad">
      <div class="bars">${weeks.map((w,i)=>`<div><i class="${i===7?'now':''}" style="height:${w.v/mx*100}%"></i><span class="mono">${w.l}</span></div>`).join('')}</div>
      <div class="tiny dim">Séries validées hors échauffement. Semaine précédente <span class="mono">${nf(weeks[6].v)} kg</span>.</div></div>`;
    const prs={};
    hist.forEach(w=>w.ex.forEach(e=>e.sets.forEach(s=>{ if(!s.done||!isWork(s)||!s.w||!s.r) return;
      const v=est1RM(+s.w,+s.r); if(!prs[e.exId]||v>prs[e.exId].v) prs[e.exId]={v,w:+s.w,r:+s.r}; })));
    const ks=Object.keys(prs).sort((a,b)=>prs[b].v-prs[a].v);
    if(ks.length) h+=`<div class="lbl"><span>Records</span><span>estimés sur une répétition</span></div><div class="plate">${ks.map(k=>`<button class="ri" data-act="detail" data-id="${k}"><div class="grow ell">${esc(exById(k)?.n||k)}</div><span class="mono tiny dim">${prs[k].w} × ${prs[k].r}</span><span class="mono" style="width:62px;text-align:right">${Math.round(prs[k].v)} kg</span></button>`).join('')}</div>`;
  }
  const days=[]; let sum=0,n=0;
  for(let i=6;i>=0;i--){ const d=addDays(today(),-i), k=totals(dayLog(d)).kcal; days.push({k,l:new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'narrow'})}); if(k>0){sum+=k;n++} }
  const mx=Math.max(tg.kcal,...days.map(d=>d.k));
  h+=`<div class="lbl"><span>Calories, 7 jours</span><span class="mono">${n}/7 renseignés</span></div><div class="plate pad">
    <div class="bars">${days.map((d,i)=>`<div><i class="${i===6?'now':''}" style="height:${d.k/mx*100}%"></i><span class="mono">${d.l}</span></div>`).join('')}</div>
    <div class="tiny dim">Moyenne des jours renseignés <span class="mono">${n?nf(sum/n):0} kcal</span> pour un objectif de <span class="mono">${nf(tg.kcal)}</span>.</div></div>`;
  return h;
}

/* ═════════ 15. IA — échec propre sans clé ═════════ */
async function runAI(id,prompt){
  const out=document.getElementById(id); if(!out) return;
  out.innerHTML=`<div class="ai"><span class="spin"></span>Rédaction…</div>`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    if(!r.ok) throw 0;
    const d=await r.json();
    out.innerHTML=`<div class="ai">${esc((d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim())}</div>`;
  }catch(e){
    out.innerHTML=`<div class="ai">L'IA n'est pas joignable depuis cette page. En ligne, il faudra une Edge Function Supabase pour porter la clé. Le reste de l'application fonctionne sans.</div>`;
  }
}

/* ═════════ 16. ÉVÉNEMENTS (délégation) ═════════ */
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset?.in; if(!k) return;
  if(k==='w'||k==='r'){ const a=activeW(); if(!a) return; a.ex[+el.dataset.i].sets[+el.dataset.s][k]=el.value; saveActive(a); }
  if(k==='foodQ') foodQ=el.value;
  if(k==='tplName' && EDIT) EDIT.name=el.value;
  if(k==='progName') S.set('progName',el.value.trim()||'Mon programme');
  if(k==='libQ'){ libQ=el.value; const lib=el.closest('.exlib'); lib.querySelector('.exlist').innerHTML=exItems(+lib.dataset.pick); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='foodQ'){ e.preventDefault(); doFoodSearch(); }
  if(e.key==='Enter'&&e.target.id==='renIn'){ e.preventDefault(); handle('renOk',e.target); }
});
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(el) handle(el.dataset.act,el); });

function handle(act,el){
  const a=activeW();
  switch(act){
    case 'close': PENDING=null; closeModal(); break;
    case 'askOk': { const f=PENDING; PENDING=null; closeModal(); if(f) f(); break; }
    case 'renOk': { const w=activeW(), v=($('#renIn')?.value||'').trim().slice(0,40); if(w&&v){ w.name=v; saveActive(w); } closeModal(); render(); break; }
    case 'photoTap': el.classList.toggle('paused'); break;

    case 'startTpl': {
      const t=tpls().find(x=>x.id===el.dataset.id); if(!t) break;
      saveActive({id:uid(),tplId:t.id,date:today(),name:t.name,start:Date.now(),
        ex:t.ex.map(e=>({exId:e.exId,rep:e.rep||null,sets:Array.from({length:e.n},()=>({w:'',r:'',k:'n',done:false}))}))});
      keepAwake(true); closeModal(); setTab('workout'); break;
    }
    case 'tplOpen': { const t=tpls().find(x=>x.id===el.dataset.id); if(t) openModal(t.name,tplViewHTML(t)); break; }
    case 'tplNew': EDIT={id:uid(),name:'',ex:[],gen:!!el.dataset.prog,_fromProg:!!el.dataset.prog}; openModal('Nouvelle séance',tplEditHTML()); break;
    case 'tplProg': EDIT.gen=!EDIT.gen; openModal(EDIT.name||'Modifier',tplEditHTML()); break;
    case 'progEdit': openModal('Mon programme',progEditHTML()); break;
    case 'progDone': closeModal(); render(); break;
    case 'progToggle': {
      const T=tpls(), i=T.findIndex(t=>t.id===el.dataset.id); if(i<0) break;
      const [t]=T.splice(i,1); t.gen=!t.gen; T.push(t);   /* une séance ajoutée passe en fin de rotation */
      S.set('templates',T); openModal('Mon programme',progEditHTML()); break;
    }
    case 'progMove': {
      const T=tpls(), idx=T.map((t,i)=>t.gen?i:-1).filter(i=>i>=0);
      const k=idx.findIndex(i=>T[i].id===el.dataset.id), k2=k+ +el.dataset.d;
      if(k<0||k2<0||k2>=idx.length) break;
      [T[idx[k]],T[idx[k2]]]=[T[idx[k2]],T[idx[k]]];
      S.set('templates',T); openModal('Mon programme',progEditHTML()); break;
    }
    case 'tplEdit': { const t=tpls().find(x=>x.id===el.dataset.id); if(!t) break; EDIT=JSON.parse(JSON.stringify(t)); openModal('Modifier',tplEditHTML()); break; }
    case 'tplFromW': {
      const w=S.get('workouts',[]).find(x=>x.id===el.dataset.id); if(!w) break;
      EDIT={id:uid(),name:w.name,gen:false,ex:w.ex.map(e=>({exId:e.exId,n:Math.max(1,e.sets.filter(isWork).length),rep:e.rep||null}))};
      openModal('Nouveau modèle',tplEditHTML()); break;
    }
    case 'tplAddEx': libQ=''; openModal('Ajouter au modèle',exLib(2)); break;
    case 'chooseTplEx': EDIT.ex.push({exId:el.dataset.id,n:3,rep:null}); openModal(EDIT.name||'Nouvelle séance',tplEditHTML()); break;
    case 'tplSets': { const e=EDIT.ex[+el.dataset.i]; e.n=Math.min(8,Math.max(1,e.n+ +el.dataset.d)); openModal(EDIT.name||'Modifier',tplEditHTML()); break; }
    case 'tplRep': {
      const e=EDIT.ex[+el.dataset.i], cur=e.rep||exById(e.exId).rep;
      const i=REPPRESETS.findIndex(r=>r[0]===cur[0]&&r[1]===cur[1]);
      e.rep=REPPRESETS[(i+1)%REPPRESETS.length].slice(); openModal(EDIT.name||'Modifier',tplEditHTML()); break;
    }
    case 'tplMove': { const i=+el.dataset.i, j=i+ +el.dataset.d; if(j<0||j>=EDIT.ex.length) break; [EDIT.ex[i],EDIT.ex[j]]=[EDIT.ex[j],EDIT.ex[i]]; openModal(EDIT.name||'Modifier',tplEditHTML()); break; }
    case 'tplDelEx': EDIT.ex.splice(+el.dataset.i,1); openModal(EDIT.name||'Modifier',tplEditHTML()); break;
    case 'tplSave': {
      EDIT.name=(EDIT.name||'').trim().slice(0,40);
      if(!EDIT.name){ toast('Donne un nom à la séance'); break; }
      if(!EDIT.ex.length){ toast('Ajoute au moins un exercice'); break; }
      const back=EDIT._fromProg; delete EDIT._fromProg; EDIT.auto=false;
      const T=tpls(), i=T.findIndex(t=>t.id===EDIT.id);
      if(i>=0){
        const wasIn=T[i].gen; T[i]=EDIT;
        if(!wasIn&&EDIT.gen){ T.splice(i,1); T.push(EDIT); }   /* rejoint la rotation en dernier */
      } else T.push(EDIT);
      S.set('templates',T); toast('Séance enregistrée');
      if(back){ openModal('Mon programme',progEditHTML()); render(); } else { closeModal(); render(); }
      break;
    }
    case 'tplDel': { const id=el.dataset.id; ask('Supprimer ce modèle ?','Ton historique n\'est pas touché.','Supprimer',()=>{ S.set('templates',tpls().filter(t=>t.id!==id)); render(); toast('Modèle supprimé'); }); break; }
    case 'genOpen': GEN=GEN||genDefaults(); GENPREV=null; openModal('Générer un programme',genHTML()); break;
    case 'genSet': { const v=el.dataset.v; GEN[el.dataset.k]=el.dataset.k==='days'?+v:v; if(GEN.eq==='pdc'&&GEN.days>4) GEN.days=4; GENPREV=null; openModal('Générer un programme',genHTML()); break; }
    case 'genRun': GENPREV=genProgram(GEN); openModal('Générer un programme',genHTML()); break;
    case 'genSave': {
      /* les séances générées non retouchées sont remplacées ; tes séances à toi passent dans « Autres séances » */
      const keep=tpls().filter(t=>!(t.gen&&t.auto)).map(t=>t.gen?{...t,gen:false}:t);
      S.set('templates',keep.concat(GENPREV.map(d=>({id:uid(),name:d.name,ex:d.ex,gen:true,auto:true}))));
      S.set('progName',SPLITNAME[GEN.days]);
      S.set('rest',GOALREST[GEN.obj]); GENPREV=null; closeModal(); setTab('workout');
      toast('Programme enregistré · repos réglé sur '+(GOALREST[GEN.obj]/60).toString().replace('.',',')+' min'); break;
    }
    case 'profile': openModal('Profil et réglages',profileSheet()); break;

    case 'startW': case 'repeatW': {
      const h=new Date().getHours();
      const w={id:uid(),date:today(),name:h<12?'Séance du matin':h<18?'Séance de l\'après-midi':'Séance du soir',start:Date.now(),ex:[]};
      if(act==='repeatW'){
        const src=S.get('workouts',[]).find(x=>x.id===el.dataset.id);
        if(src){ w.name=src.name; w.tplId=src.tplId||null; w.ex=src.ex.map(e=>({exId:e.exId,rep:e.rep||null,sets:e.sets.map(s=>({w:'',r:'',k:s.k||'n',done:false}))})); }
      }
      saveActive(w); keepAwake(true); closeModal(); setTab('workout'); break;
    }
    case 'renameW': openModal('Renommer la séance',`<div class="field"><input id="renIn" value="${esc(a.name)}" maxlength="40" aria-label="Nom de la séance"></div><button class="btn" data-act="renOk">Enregistrer</button>`,true); setTimeout(()=>$('#renIn')?.select(),50); break;
    case 'pickEx': libQ=''; openModal('Ajouter un exercice',exLib(true)); break;
    case 'libFilter': { libFilter=el.dataset.m; const lib=el.closest('.exlib');
      lib.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===libFilter));
      lib.querySelector('.exlist').innerHTML=exItems(+lib.dataset.pick); break; }
    case 'detail': openModal(exById(el.dataset.id)?.n||'Mouvement',detailHTML(el.dataset.id)); break;
    case 'chooseEx': {
      if(!a){ closeModal(); toast('Commence une séance d\'abord'); setTab('workout'); break; }
      const le=lastEntry(el.dataset.id), n=le?Math.max(1,le.sets.length):3;
      a.ex.push({exId:el.dataset.id,sets:Array.from({length:n},(_,i)=>({w:'',r:'',k:le?.sets[i]?.k||'n',done:false}))});
      saveActive(a); closeModal(); setTab('workout'); window.scrollTo(0,document.body.scrollHeight); toast(exById(el.dataset.id).n+' ajouté'); break;
    }
    case 'delEx': { const i=+el.dataset.i; ask('Retirer cet exercice ?','Les séries saisies pour cet exercice seront perdues.','Retirer',()=>{ const w=activeW(); if(!w) return; w.ex.splice(i,1); saveActive(w); render(); }); break; }
    case 'addSet': { const e=a.ex[+el.dataset.i], l=e.sets[e.sets.length-1]; e.sets.push({w:l?l.w:'',r:'',k:'n',done:false}); saveActive(a); render(); break; }
    case 'cycle': { const s=a.ex[+el.dataset.i].sets[+el.dataset.s]; s.k={n:'w',w:'f',f:'n'}[s.k||'n']; saveActive(a); render(); break; }
    case 'usePrev': {
      const e=a.ex[+el.dataset.i], p=lastEntry(e.exId)?.sets[+el.dataset.s]; if(!p) break;
      const s=e.sets[+el.dataset.s]; s.w=p.w; s.r=p.r; saveActive(a); render(); break;
    }
    case 'toggle': {
      const e=a.ex[+el.dataset.i], si=+el.dataset.s, s=e.sets[si];
      if(!s.done){
        const p=lastEntry(e.exId)?.sets[si], sg=suggest(e.exId,e.rep), ex=exById(e.exId);
        if(s.w==='') s.w = p ? p.w : (sg&&sg.w!==null ? sg.w : '');
        if(s.r==='') s.r = p ? p.r : (e.rep||ex.rep)[1];
        if(s.w===''){ toast('Indique le poids — 0 pour le poids du corps'); break; }
        if(isWork(s) && +s.r>0){
          const prev=best1RM(e.exId), v=est1RM(+s.w,+s.r);
          const sessionBest=Math.max(0,...e.sets.filter(x=>x!==s&&x.done&&isWork(x)).map(x=>est1RM(+x.w,+x.r)));
          if(prev>0 && v>prev && v>sessionBest){ s.pr=true; toast(`Nouveau record · ${Math.round(v)} kg estimés`); }
        }
        s.done=true; startRest();
      } else { s.done=false; s.pr=false; }
      saveActive(a); render(); break;
    }
    case 'restAdj': if(REST.end){ REST.end+= +el.dataset.v*1000; REST.total=Math.max(REST.total,REST.end-Date.now()); restTick(); } break;
    case 'restSkip': REST.end=0; restTick(); break;
    case 'finishW': {
      const kept=a.ex.map(e=>({exId:e.exId,rep:e.rep||null,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
      if(!kept.length){ toast('Valide au moins une série'); break; }
      const hist=S.get('workouts',[]);
      hist.unshift({id:a.id,tplId:a.tplId||null,date:a.date,name:a.name,dur:Math.max(1,Math.round((Date.now()-a.start)/60000)),ex:kept});
      S.set('workouts',hist); S.del('active'); REST.end=0; restTick(); keepAwake(false); render(); toast('Séance enregistrée'); break;
    }
    case 'cancelW': ask('Abandonner la séance ?','Rien ne sera enregistré.','Abandonner',()=>{ S.del('active'); REST.end=0; restTick(); keepAwake(false); render(); toast('Séance abandonnée'); }); break;
    case 'openW': {
      const w=S.get('workouts',[]).find(x=>x.id===el.dataset.id); if(!w) break;
      let h=`<div class="tiny mono dim" style="margin:-2px 2px 14px">${fmtDate(w.date)} · ${w.dur} min · ${nf(volumeOf(w))} kg</div>`;
      w.ex.forEach(e=>{ const ex=exById(e.exId); if(!ex) return;
        h+=`<div class="plate"><div class="exhead"><div class="thumb">${figSVG(ex.a)}</div><div class="grow"><b>${esc(ex.n)}</b><div class="tiny mono dim">${e.sets.map(s=>(s.k==='w'?'É ':s.k==='f'?'X ':'')+s.w+'×'+s.r).join('  ·  ')}</div></div></div></div>`; });
      h+=`<button class="btn" style="margin-top:6px" data-act="repeatW" data-id="${w.id}">Refaire cette séance</button><button class="btn sec" style="margin-top:8px" data-act="tplFromW" data-id="${w.id}">Enregistrer comme modèle</button><button class="btn ter" data-act="delW" data-id="${w.id}">Supprimer</button>`;
      openModal(w.name,h); break;
    }
    case 'delW': { const id=el.dataset.id; ask('Supprimer cette séance ?','Elle disparaît de l\'historique et des statistiques.','Supprimer',()=>{ S.set('workouts',S.get('workouts',[]).filter(x=>x.id!==id)); render(); toast('Séance supprimée'); }); break; }

    case 'dayPrev': curDay=addDays(curDay,-1); render(); break;
    case 'dayNext': if(curDay<today()){ curDay=addDays(curDay,1); render(); } break;
    case 'addFood': foodMeal=el.dataset.meal; foodQ=''; foodRes=null; openModal('Ajouter un aliment',foodSheet()); break;
    case 'doFoodSearch': doFoodSearch(); break;
    case 'pickFood': pendingFood=foodList[+el.dataset.i]; if(pendingFood) openModal('Quantité',qtySheet(pendingFood)); break;
    case 'qtyQuick': { const q=$('#qty'); if(q) q.value=el.dataset.q; break; }
    case 'confirmFood': {
      const q=Math.max(1,+$('#qty').value||100), f=pendingFood, k=q/100, l=dayLog(curDay);
      (l[foodMeal]=l[foodMeal]||[]).push({n:f.n,q,kcal:f.kcal*k,p:f.p*k,c:f.c*k,f:f.f*k});
      saveDayLog(curDay,l); pushRecent(f,q); closeModal(); render(); toast('Ajouté'); break;
    }
    case 'foodCustom': openModal('Saisie manuelle',customSheet()); break;
    case 'confirmCustom': {
      const l=dayLog(curDay), v=id=>+$(id).value||0;
      (l[foodMeal]=l[foodMeal]||[]).push({n:$('#cfN').value.trim()||'Plat maison',q:'—',kcal:v('#cfK'),p:v('#cfP'),c:v('#cfC'),f:v('#cfF')});
      saveDayLog(curDay,l); closeModal(); render(); toast('Ajouté'); break;
    }
    case 'copyY': {
      const k=el.dataset.meal, y=dayLog(addDays(curDay,-1)), l=dayLog(curDay);
      l[k]=(l[k]||[]).concat((y[k]||[]).map(i=>({...i}))); saveDayLog(curDay,l); render(); toast('Repas copié'); break;
    }
    case 'delFood': { const l=dayLog(curDay); l[el.dataset.meal].splice(+el.dataset.i,1); saveDayLog(curDay,l); render(); break; }

    case 'saveW': {
      const v=parseFloat(String($('#wIn').value).replace(',','.'));
      if(!(v>25&&v<300)){ toast('Poids invalide'); break; }
      const W=S.get('weights',{}); W[today()]=Math.round(v*10)/10; S.set('weights',W);
      const p=getProfile(); p.poids=W[today()]; S.set('profile',p); render(); toast('Pesée enregistrée'); break;
    }
    case 'useAdapt': { const p=getProfile(); p.tdeeAdapt=+el.dataset.v; S.set('profile',p); render(); toast('Objectif recalé sur ta dépense réelle'); break; }
    case 'resetAdapt': { const p=getProfile(); p.tdeeAdapt=null; S.set('profile',p); openModal('Profil et réglages',profileSheet()); render(); break; }
    case 'saveProfile': {
      const p=getProfile();
      Object.assign(p,{sexe:$('#pfSexe').value,age:+$('#pfAge').value||p.age,taille:+$('#pfT').value||p.taille,poids:+$('#pfP').value||p.poids,act:+$('#pfAct').value,obj:$('#pfObj').value});
      S.set('profile',p); S.set('rest',+$('#pfRest').value); closeModal(); render(); toast('Profil enregistré'); break;
    }
    case 'exportData': {
      const dump={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(P)) dump[k.slice(P.length)]=JSON.parse(localStorage.getItem(k)); }
      const url=URL.createObjectURL(new Blob([JSON.stringify(dump,null,2)],{type:'application/json'}));
      const ln=document.createElement('a'); ln.href=url; ln.download='atelier-'+today()+'.json'; ln.click(); URL.revokeObjectURL(url); toast('Exporté'); break;
    }
    case 'wipe': ask('Tout effacer ?','Séances, repas, pesées et modèles. C\'est définitif : exporte tes données avant si tu veux les garder.','Tout effacer',()=>{ Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k)); render(); toast('Données effacées'); }); break;

    case 'aiCoach': runAI('aiCoachOut',coachPrompt()); break;
    case 'aiRecipe': runAI('aiRecipeOut',recipePrompt()); break;
  }
}

/* migration v1 → v2 : la durée était stockée en texte */
(function migrate(){ const h=S.get('workouts',[]); let ch=false; h.forEach(w=>{ if(typeof w.dur==='string'){ w.dur=parseInt(w.dur)||0; ch=true; } w.ex.forEach(e=>e.sets.forEach(s=>{ if(!s.k){s.k='n';ch=true} })); }); if(ch) S.set('workouts',h); })();

render();
if(activeW()) keepAwake(true);
setInterval(()=>{ const a=activeW(); if(TAB==='workout'&&a&&!modal.classList.contains('on')) $('#pageSub').textContent=`En cours depuis ${Math.max(0,Math.round((Date.now()-a.start)/60000))} min`; },20000);
</script>
